services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zhlx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: zhlx
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhlx -d zhlx"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      DATABASE_URL: postgres://zhlx:${POSTGRES_PASSWORD}@db:5432/zhlx
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?set ADMIN_API_TOKEN}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      UPSTREAM_URL: ${UPSTREAM_URL:?set UPSTREAM_URL}
      DEPLOYMENT_ID: ${DEPLOYMENT_ID:-default}
      CAPTURE_ENABLED: ${CAPTURE_ENABLED:-false}
      NEWAPI_LOG_SYNC_ENABLED: ${NEWAPI_LOG_SYNC_ENABLED:-false}
      NEWAPI_BASE_URL: ${NEWAPI_BASE_URL:-}
      NEWAPI_ADMIN_TOKEN: ${NEWAPI_ADMIN_TOKEN:-}
      NEWAPI_ADMIN_USER_ID: ${NEWAPI_ADMIN_USER_ID:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}

volumes:
  pgdata:
