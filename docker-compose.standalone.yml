services:
  zhlx-newapi-token:
    build: .
    image: zhlx-newapi-token:0.1.0
    container_name: zhlx-newapi-token
    restart: unless-stopped
    ports:
      - "50085:8080"
    volumes:
      - ./data:/app/data
      # 只读挂载 New API 的 SQLite 日志库，用于增量同步
      - /home/ubuntu/new-api/data:/newapi-data:ro
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      DEPLOYMENT_ID: prod-43.162.111.70
      DATABASE_URL: file:/app/data/zhlx.db
      UPSTREAM_URL: http://new-api:3000
      LOG_LEVEL: info
      # 采集开关与范围由 .env 控制，便于不改文件直接启停
      CAPTURE_ENABLED: ${CAPTURE_ENABLED:-false}
      ADMIN_PATH: ${ADMIN_PATH:-/_zhlx/admin}
      HEALTH_PATH: ${HEALTH_PATH:-/_zhlx/healthz}
      CAPTURE_ROUTES: ${CAPTURE_ROUTES:-/v1/chat/completions,/v1/responses,/v1/messages,/v1/completions}
      CAPTURE_MAX_BYTES: ${CAPTURE_MAX_BYTES:-262144}
      CAPTURE_MAX_CHARS: ${CAPTURE_MAX_CHARS:-8000}
      PROMPT_RETENTION_DAYS: ${PROMPT_RETENTION_DAYS:-30}
      IDENTITY_MODE: auto
      # 二期离线分类：off / keyword / llm
      CLASSIFIER_MODE: ${CLASSIFIER_MODE:-off}
      CLASSIFIER_INTERVAL_MS: ${CLASSIFIER_INTERVAL_MS:-300000}
      CLASSIFIER_BATCH_SIZE: ${CLASSIFIER_BATCH_SIZE:-50}
      CLASSIFIER_MAX_ATTEMPTS: ${CLASSIFIER_MAX_ATTEMPTS:-5}
      CLASSIFIER_REVIEW_THRESHOLD: ${CLASSIFIER_REVIEW_THRESHOLD:-60}
      CLASSIFIER_LLM_BASE_URL: ${CLASSIFIER_LLM_BASE_URL:-}
      CLASSIFIER_LLM_TOKEN: ${CLASSIFIER_LLM_TOKEN:-}
      CLASSIFIER_LLM_MODEL: ${CLASSIFIER_LLM_MODEL:-}
      # 分类服务专用凭证，按人员/凭证分组时排除
      EXCLUDE_TOKEN_IDS: ${EXCLUDE_TOKEN_IDS:-}
      NEWAPI_LOG_SYNC_ENABLED: "true"
      NEWAPI_SQLITE_PATH: /newapi-data/one-api.db
      NEWAPI_LOG_PAGE_SIZE: "500"
      NEWAPI_LOG_INITIAL_BACKFILL_HOURS: "8760"
      NEWAPI_LOG_SYNC_INTERVAL_MS: "300000"
      SESSION_COOKIE_SECURE: "false"
      TRUST_PROXY_HEADERS: "false"
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?set ADMIN_API_TOKEN}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
    networks:
      - new-api_default

networks:
  new-api_default:
    external: true
